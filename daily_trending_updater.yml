name: Daily Trending FMCG Feed Updater

on:
  schedule:
    # Runs daily at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  update-trending-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Trending Feed Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "scripts/scrape_trending_fmcg.js" ]; then
            node scripts/scrape_trending_fmcg.js
          elif [ -f "scrape_trending_fmcg.js" ]; then
            node scrape_trending_fmcg.js
          fi

      - name: Commit and Push Updated Feed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add trending_fmcg.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): auto-update daily trending FMCG catalog [skip ci]" && git push)
